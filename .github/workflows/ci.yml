name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate CI guards
        run: npm run test:ci-scripts
      - name: Lint
        run: npm run lint:ci
      - name: TypeScript
        run: npm run typecheck:ci
      - name: Mobile tests
        run: npm run test:ci

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      TASK_TIMEZONE: America/Sao_Paulo
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Migrate database
        env:
          DATABASE_PATH: ${{ runner.temp }}/gestor-diario-ci/backend.db
        run: npm run db:migrate
      - name: Backend typecheck
        run: npm run typecheck
      - name: Backend tests
        run: npm test
      - name: Backend build
        run: npm run build
